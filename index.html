<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <style>
    :root {
      color-scheme: light dark;
      --ui-font: "Pretendard", sans-serif;
      --bg-page: transparent;
      --bg-card: transparent;
      --calc-border: #d9d9d9;
      --item-bg: transparent;
      --item-border: #cfcfcf;
      --item-hover: rgba(0,0,0,0.03);
      --text-main: #111;
      --text-sub: #444;
      --accent: #ff3b3b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: transparent;
        --bg-card: transparent;
        --calc-border: #3a3a3a;
        --item-bg: transparent;
        --item-border: #444444;
        --item-hover: rgba(255,255,255,0.04);
        --text-main: #f0f0f0;
        --text-sub: #aaaaaa;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--ui-font);
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .tools-panel {
      width: 100%;
      max-width: 800px;
      padding: 20px 24px 24px;
      border: 1px solid var(--calc-border);
      border-radius: 14px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .tools-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .tools-title {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .tools-subtitle {
      margin-top: 6px;
      color: var(--text-sub);
      font-size: 13px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--item-border);
      border-radius: 6px;
      background: var(--item-bg);
      color: var(--text-main);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .menu-card:hover {
      background: var(--item-hover);
      border-color: var(--accent);
    }

    .menu-card h2 {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      text-align: center;
    }

    @media (max-width: 600px) {
      .tools-panel {
        padding: 20px 20px 22px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .menu-card {
        min-height: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="tools-panel">
    <header class="tools-header">
      <a class="tools-title" href="https://kdy173000.github.io/fireballNotion/">Tools</a>
      <p class="tools-subtitle">사용할 도구를 선택하세요</p>
    </header>

    <div class="menu-grid">
      <a href="https://kdy173000.github.io/fireballNotion/index/mloz.html" class="menu-card">
        <h2>ml / oz / L 변환</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/clock.html" class="menu-card">
        <h2>나라별 시간</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/DilutionRatio.html" class="menu-card">
        <h2>희석비 계산</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/stock.html" class="menu-card">
        <h2>재고 계산</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/KRW.html" class="menu-card">
        <h2>환율 계산</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/percent.html" class="menu-card">
        <h2>변화율 계산</h2>
      </a>

      <a href="https://kdy173000.github.io/fireballNotion/index/lang.html" class="menu-card">
        <h2>번역기</h2>
      </a>
    </div>
  </main>


</body></html>

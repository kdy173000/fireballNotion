<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용량 변환</title>
  <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>

<div class="volume-calculator">
  <div class="calc-header">
    <h2 class="calc-title">
      <a href="https://kdy173000.github.io/fireballNotion/" class="title-link">용량 변환</a>
    </h2>
  </div>

  <div class="fields-row">
    <div class="field">
      <label for="mlAmount">ml</label>
      <input type="text" id="mlAmount" class="transparent-input" placeholder="500" inputmode="decimal">
    </div>

    <div class="field">
      <label for="ozAmount">oz</label>
      <input type="text" id="ozAmount" class="transparent-input" placeholder="16.91" inputmode="decimal">
    </div>

    <div class="field">
      <label for="literAmount">L</label>
      <input type="text" id="literAmount" class="transparent-input" placeholder="0.5" inputmode="decimal">
    </div>
  </div>
</div>

<style>
:root {
  color-scheme: light dark;
  --ui-font: "Pretendard", sans-serif;
  --bg-page: transparent;
  --bg-card: transparent;
  --calc-border: #d9d9d9;
  --text-main: #111;
  --text-sub: #444;
  --input-bg: #ffffff;
  --input-border: #cfcfcf;
  --placeholder: #9a9a9a;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: transparent;
    --bg-card: transparent;
    --calc-border: #3a3a3a;
    --text-main: #f0f0f0;
    --text-sub: #aaaaaa;
    --input-bg: #2e2e2e;
    --input-border: #444444;
    --placeholder: #666666;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--ui-font);
  background: var(--bg-page);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}

.volume-calculator {
  font-family: var(--ui-font);
  background: var(--bg-card);
  border: 1px solid var(--calc-border);
  border-radius: 14px;
  padding: 20px 24px 24px;
  width: 100%;
  max-width: 800px;
}

.calc-header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.calc-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
}

.title-link {
  color: inherit;
  text-decoration: none;
  cursor: default;
}

.fields-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field {
  min-width: 0;
}

label {
  display: block;
  margin-bottom: 3px;
  font-size: 13px;
  color: var(--text-sub);
}

input {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 0;
  border-radius: 6px;
  border: 1px solid var(--input-border);
  font-size: 15px;
  font-family: var(--ui-font);
  background: var(--input-bg);
  color: var(--text-main);
  text-align: center;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

input::placeholder { color: var(--placeholder); }
input:focus { outline: none; border-color: #888; }
.transparent-input { background: transparent; }

@media (min-width: 600px) {
  .fields-row {
    flex-direction: row;
    gap: 12px;
  }

  .field {
    flex: 1;
  }
}
</style>

<script>
const mlInput = document.getElementById("mlAmount");
const ozInput = document.getElementById("ozAmount");
const literInput = document.getElementById("literAmount");

const ML_PER_OZ = 29.5735;
const ML_PER_LITER = 1000;

let isUpdating = false;

function parseValue(value) {
  return parseFloat(String(value).replace(",", "."));
}

function formatValue(value, digits) {
  if (!isFinite(value)) return "";
  return Number.isInteger(value) ? String(value) : value.toFixed(digits);
}

function updateFromMl(ml) {
  ozInput.value = formatValue(ml / ML_PER_OZ, 2);
  literInput.value = formatValue(ml / ML_PER_LITER, 3);
}

function updateFromOz(oz) {
  const ml = oz * ML_PER_OZ;
  mlInput.value = formatValue(ml, 0);
  literInput.value = formatValue(ml / ML_PER_LITER, 3);
}

function updateFromLiter(liter) {
  const ml = liter * ML_PER_LITER;
  mlInput.value = formatValue(ml, 0);
  ozInput.value = formatValue(ml / ML_PER_OZ, 2);
}

function clearOtherInputs(changedInput) {
  [mlInput, ozInput, literInput].forEach(input => {
    if (input !== changedInput) input.value = "";
  });
}

function handleInput(changedInput, converter) {
  if (isUpdating) return;
  isUpdating = true;

  const value = parseValue(changedInput.value);
  if (isNaN(value)) {
    clearOtherInputs(changedInput);
  } else {
    converter(value);
  }

  isUpdating = false;
}

mlInput.addEventListener("input", () => handleInput(mlInput, updateFromMl));
ozInput.addEventListener("input", () => handleInput(ozInput, updateFromOz));
literInput.addEventListener("input", () => handleInput(literInput, updateFromLiter));
</script>



</body></html>

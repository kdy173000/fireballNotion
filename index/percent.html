<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>변화율 계산기</title>
  <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>

<div class="percent-calculator">
  <div class="calc-header">
    <h2 class="calc-title">
      <a href="https://kdy173000.github.io/fireballNotion/" class="title-link">Percent</a>
    </h2>
  </div>

  <div class="fields-row">
    <div class="field">
      <label for="before">전</label>
      <input type="text" id="before" class="transparent-input" placeholder="0" inputmode="decimal">
    </div>

    <div class="field">
      <label for="after">후</label>
      <input type="text" id="after" class="transparent-input" placeholder="0" inputmode="decimal">
    </div>

    <div class="field">
      <label for="pct">변화율</label>
      <input type="text" id="pct" class="transparent-input" placeholder="0" inputmode="decimal">
    </div>
  </div>
</div>

<style>
:root {
  color-scheme: light dark;
  --ui-font: "Pretendard", sans-serif;
  --bg-page: transparent;
  --bg-card: transparent;
  --calc-border: #d9d9d9;
  --text-main: #111;
  --text-sub: #444;
  --input-bg: #ffffff;
  --input-border: #cfcfcf;
  --placeholder: #9a9a9a;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: transparent;
    --bg-card: transparent;
    --calc-border: #3a3a3a;
    --text-main: #f0f0f0;
    --text-sub: #aaaaaa;
    --input-bg: #2e2e2e;
    --input-border: #444444;
    --placeholder: #666666;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--ui-font);
  background: var(--bg-page);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}

.percent-calculator {
  font-family: var(--ui-font);
  background: var(--bg-card);
  border: 1px solid var(--calc-border);
  border-radius: 14px;
  padding: 20px 24px 24px;
  width: 100%;
  max-width: 800px;
}

.calc-header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.calc-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
}

.title-link {
  color: inherit;
  text-decoration: none;
  cursor: default;
}

.fields-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field {
  min-width: 0;
}

label {
  display: block;
  margin-bottom: 3px;
  font-size: 13px;
  color: var(--text-sub);
}

input {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 0;
  border-radius: 6px;
  border: 1px solid var(--input-border);
  font-size: 15px;
  font-family: var(--ui-font);
  background: var(--input-bg);
  color: var(--text-main);
  text-align: center;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

input::placeholder { color: var(--placeholder); }
input:focus { outline: none; border-color: #888; }
.transparent-input { background: transparent; }

@media (min-width: 600px) {
  .fields-row {
    flex-direction: row;
    gap: 12px;
  }

  .field {
    flex: 1;
  }
}
</style>

<script>
const bEl = document.getElementById("before");
const aEl = document.getElementById("after");
const pEl = document.getElementById("pct");

function parseValue(el) {
  return parseFloat(String(el.value).replace(/,/g, ""));
}

function setNumber(el, value) {
  el.value = Number.isInteger(value) ? String(value) : value.toFixed(2);
}

function calc(changed) {
  const before = parseValue(bEl);
  const after = parseValue(aEl);
  const percent = parseValue(pEl);

  if (changed === "pct" && !isNaN(before) && !isNaN(percent)) {
    const nextAfter = before * (1 + percent / 100);
    setNumber(aEl, nextAfter);
    return;
  }

  if (changed === "after" && isNaN(before) && !isNaN(after) && !isNaN(percent) && percent !== -100) {
    const nextBefore = after / (1 + percent / 100);
    setNumber(bEl, nextBefore);
    return;
  }

  if (!isNaN(before) && !isNaN(after) && before !== 0) {
    const nextPercent = ((after - before) / before) * 100;
    setNumber(pEl, nextPercent);
  }
}

bEl.addEventListener("input", () => calc("before"));
aEl.addEventListener("input", () => calc("after"));
pEl.addEventListener("input", () => calc("pct"));
</script>



</body></html>
